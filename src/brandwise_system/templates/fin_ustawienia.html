{% extends "base.html" %}{% block title %}Ustawienia{% endblock %}
{% block content %}
<header class="top"><h1>Ustawienia</h1></header>
{% if msg %}<p class="ok">Zapisano.</p>{% endif %}
<form method="post" action="/ustawienia" class="card form">
  <div class="grid">
    <label>Statusy zleceń (jeden w linii)<textarea name="status" rows="8">{{ statuses }}</textarea></label>
    <label>Statusy fakturowania (jeden w linii)<textarea name="invoice_status" rows="8">{{ inv_statuses }}</textarea></label>
  </div>
  <p class="hint">„Brak” oznacza zlecenie do zafakturowania, „Faktura” – zafakturowane. Te dwie nazwy liczą się w podsumowaniach.</p>
  <div class="actions"><button>Zapisz</button></div>
</form>
{% endblock %}
