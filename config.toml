# Ustawienia jawne (w repo). Sekrety wyłącznie w .env.
host = "system.brandwise.cloud"       # adres przejściowy; docelowo panel.brandwise.pl (passkeys trzeba wtedy utworzyć ponownie)
data_dir = "data"
users = ["lukasz@brandwise.pl"]      # kto może dostać zaproszenie do utworzenia klucza
session_days = 30

[marek]
summary_url = "http://127.0.0.1:8780/_summary"   # panel Marka na tym samym serwerze
host = "panel.brandwise.cloud"

[fakturownia]
domain = "brandwise"               # brandwise.fakturownia.pl
kinds = ["vat", "advance", "final"]  # faktury VAT, zaliczkowe, końcowe
cache_seconds = 300

[finanse]
url = "https://panel.brandwise.pl/"  # obecny panel na mydevil – do czasu migracji

